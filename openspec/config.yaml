schema: spec-driven

context: |
  The user selected OpenSpec for both shared SC work and the Linux worktree.
  The Linux implementation predates this planning migration. Preserve existing
  uncommitted application work and distinguish imported verification evidence
  from checks performed during a new change. Use only OpenSpec for current work;
  each active change's tasks.md is the single implementation-status owner.

rules:
  tasks:
    - Give imported completed tasks an evidence reference and keep incomplete target checks open.
    - Link existing GitHub issues rather than creating duplicate implementation checklists.
