name: Desktop checks
on: [push, pull_request]
jobs:
  portable:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run verify
  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run verify
      - run: npm run native:build
      - name: Verify legacy vault interoperability
        run: npx vitest run --config vitest.windows.config.ts
      - run: npm run package:win
      # Interactive capture/UI/recorder gates run separately on a Windows desktop.
